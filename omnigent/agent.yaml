# Omnigent "fixer" agent — the thing that actually solves bugs.
#
# OpenTag just sends it the bug text (see omnigent/solve.ts) and streams its
# progress into Slack. All the real work (reading the repo, editing, testing,
# opening a PR) happens here, inside Omnigent's sandbox/worktree.
#
# Field names follow Omnigent's AGENT_YAML_SPEC.md — verify against your version;
# the TODOs are the likely-to-drift ones.

name: fixer
executor: codex          # TODO: pick your coding harness (codex / claude-code / pi)
model: openai/gpt-5.5    # TODO: confirm model field name/format for your executor

prompt: |
  You are a senior engineer that fixes bugs reported in Slack. You are given a
  bug report. Reproduce it, find the root cause in this repository, make the
  smallest correct fix, run the tests, and open a pull request describing the
  change. Ask for approval before anything destructive.

# Server-side tools run INSIDE Omnigent. The repo + git + shell come from the
# executor harness itself; add MCP servers here only if the fixer needs them
# (e.g. Linear to update the issue, Notion to read a runbook).
# tools:
#   mcp:
#     - name: linear
#       type: http
#       url: https://mcp.linear.app/mcp
#       headers: { Authorization: "Bearer ${LINEAR_API_KEY}" }
